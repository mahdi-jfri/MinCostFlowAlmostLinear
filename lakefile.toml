name = "MinCostFlowAlmostLinear"
defaultTargets = ["MinCostFlow", "Checks", "Comparator"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "b63f6e8a68d220e3b3bc4f3792bb53650d375f24"

# The machine model and its program logic (https://github.com/mahdi-jfri/WordRam).
[[require]]
name = "wordram"
git = "https://github.com/mahdi-jfri/WordRam.git"
rev = "68d5eb1ea45a4009221eccb80a05cad222551a59"

[[lean_lib]]
name = "MinCostFlow"

[[lean_lib]]
name = "Checks"
globs = ["Checks.+"]

[[lean_lib]]
name = "Comparator"
srcDir = "Comparator"
roots = ["Challenge", "Solution"]
